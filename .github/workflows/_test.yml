name: Workflow Call - Test

on:
  workflow_call:

jobs:
  test:
    name: Test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The measured floor and the newest release: a change that needs a newer bun fails on
        # the floor here rather than on a consumer's machine.
        bun: ["1.4.0", "latest"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python
        # The Python provider's PEP 696 default test skips below 3.13, which the runner's own python3 is.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test
        # bun test, including the residue tests that enforce the structural rules.
        run: bun run test

      - name: Build smoke
        # Bundles and starts every bundled provider on this bun; the suite alone never meets the artifact.
        run: bun run build --build-only
