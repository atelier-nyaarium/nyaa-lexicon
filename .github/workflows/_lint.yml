name: Workflow Call - Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        # Both halves, biome and tsc --build across every workspace reference.
        # The script runs them separately so a formatting nit cannot hide a type error.
        run: bun run lint
